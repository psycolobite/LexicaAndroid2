name: Deploy privacy policy to GitHub Pages

on:
  push:
    branches:
      - main
      - 'integration/**'
    paths:
      - 'privacy-policy/**'
      - '.github/workflows/privacy-policy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: privacy-policy-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload privacy policy artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: privacy-policy

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

